x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "pg"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_USER: "user"

x-mongo-environment: &x-mongo-environment
  # Mongo
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "admin"

x-backend-app-environment: &x-backend-app-environment
  # App
  <<: *x-db-environment

  MONGO_HOST: "app.mood.me"
  MONGO_PORT: 27017
  MONGO_USER: "admin"
  MONGO_PASSWORD: "admin"

  APP_NAME: "accord-generator"
  APP_VERSION: "1.0.0"
  APP_PORT: 8080


services:
  app:
    container_name: app
    platform: linux/amd64
    environment:
      <<: *x-backend-app-environment
    build:
      context: .
    depends_on:
      - postgres
      - pgadmin
    ports:
      - 8080:8080
    networks:
      app_network:
        aliases:
          - app.lvh.me

  mongo:
    container_name: mood
    image: mongo:8.0.11
    ports:
      - "27017:27017"
    volumes:
      - ./migration/mongo-init:/docker-entrypoint-initdb.d
    environment:
      <<: *x-backend-app-environment
    networks:
      app_network:
        aliases:
          - app.mood.me

  postgres:
    container_name: pg
    image: postgres:17
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      <<: *x-db-environment
    networks:
      app_network:
        aliases:
          - pg.lvh.me

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.5.0
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "8000:80"
    networks:
      app_network:
        aliases:
          - pgadmin.lvh.me

networks:
  app_network:
    external: false

volumes:
  db_data: